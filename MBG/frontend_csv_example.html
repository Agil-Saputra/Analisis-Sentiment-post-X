<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MBG CSV Sentiment Dashboard</title>
  <style>
    :root {
      --positive: #1f8a5b;
      --neutral: #b47b10;
      --negative: #c2413b;
      --ink: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --surface: #ffffff;
      --band: #f7f9fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--surface);
      font-family: Arial, sans-serif;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header {
      display: grid;
      gap: 8px;
      margin-bottom: 24px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.1;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 14px;
    }

    h3 {
      font-size: 17px;
    }

    .muted {
      color: var(--muted);
    }

    .upload-band {
      display: grid;
      gap: 16px;
      padding: 18px;
      margin-bottom: 24px;
      background: var(--band);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    form {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(160px, 240px) auto;
      gap: 12px;
      align-items: end;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 700;
    }

    input,
    button {
      min-height: 42px;
      font: inherit;
      border-radius: 6px;
    }

    input {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      background: #fff;
    }

    button {
      border: 0;
      color: #fff;
      background: #214f7a;
      padding: 0 18px;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    #status {
      min-height: 22px;
      font-weight: 700;
    }

    .results {
      display: none;
      gap: 28px;
    }

    .results.is-visible {
      display: grid;
    }

    .overview {
      display: grid;
      grid-template-columns: minmax(260px, 360px) 1fr;
      gap: 24px;
      align-items: center;
    }

    .chart-wrap {
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    canvas {
      width: min(320px, 100%);
      aspect-ratio: 1;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
    }

    .legend-item {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .summary-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
    }

    .summary-card strong {
      display: block;
      font-size: 30px;
      line-height: 1.1;
      margin: 8px 0;
    }

    .summary-card.positive {
      border-top: 5px solid var(--positive);
    }

    .summary-card.neutral {
      border-top: 5px solid var(--neutral);
    }

    .summary-card.negative {
      border-top: 5px solid var(--negative);
    }

    details {
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    summary {
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 760px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--band);
      color: #3c4043;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .text-cell {
      max-width: 520px;
      white-space: normal;
    }

    .empty {
      color: var(--muted);
      padding: 14px 0;
    }

    @media (max-width: 820px) {
      form,
      .overview,
      .summary-grid {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>MBG CSV Sentiment Dashboard</h1>
      <p class="muted">Upload a CSV, choose the text column, then review the sentiment split and grouped rows.</p>
    </header>

    <section class="upload-band">
      <form id="upload-form">
        <label>
          CSV file
          <input id="csv-file" type="file" accept=".csv" required>
        </label>

        <label>
          Text column
          <input id="text-column" type="text" value="text" required>
        </label>

        <button id="submit-button" type="submit">Analyze CSV</button>
      </form>

      <div id="status">Choose a CSV file with a text column.</div>
    </section>

    <section id="results" class="results">
      <section>
        <h2>Sentiment Percentage</h2>
        <div class="overview">
          <div class="chart-wrap">
            <canvas id="sentiment-chart" width="320" height="320"></canvas>
            <div id="legend" class="legend"></div>
          </div>
          <div id="summary" class="summary-grid"></div>
        </div>
      </section>

      <section>
        <h2>Rows By Sentiment</h2>
        <div id="grouped-results"></div>
      </section>
    </section>
  </main>

  <script>
    const API_URL = '/api/sentiment/predict-csv';
    const SENTIMENT_ORDER = ['positive', 'neutral', 'negative'];
    const SENTIMENT_COLORS = {
      positive: '#1f8a5b',
      neutral: '#b47b10',
      negative: '#c2413b',
    };

    const form = document.querySelector('#upload-form');
    const statusEl = document.querySelector('#status');
    const resultsEl = document.querySelector('#results');
    const summaryEl = document.querySelector('#summary');
    const groupedResultsEl = document.querySelector('#grouped-results');
    const legendEl = document.querySelector('#legend');
    const submitButton = document.querySelector('#submit-button');
    const chartCanvas = document.querySelector('#sentiment-chart');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const file = document.querySelector('#csv-file').files[0];
      const textColumn = document.querySelector('#text-column').value.trim();
      const formData = new FormData();

      formData.append('file', file);
      formData.append('text_column', textColumn);

      submitButton.disabled = true;
      statusEl.textContent = 'Uploading and analyzing...';
      resultsEl.classList.remove('is-visible');
      summaryEl.innerHTML = '';
      groupedResultsEl.innerHTML = '';
      legendEl.innerHTML = '';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: formData,
        });

        const data = await response.json();

        if (!response.ok) {
          statusEl.textContent = typeof data.detail === 'string'
            ? data.detail
            : JSON.stringify(data.detail);
          return;
        }

        statusEl.textContent = `Analyzed ${data.predicted_rows} rows. Skipped ${data.skipped_rows} rows.`;
        renderResults(data, textColumn);
        resultsEl.classList.add('is-visible');
      } catch (error) {
        statusEl.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });

    function renderResults(data, textColumn) {
      renderChart(data.summary);
      renderLegend(data.summary);
      renderSummary(data.summary);
      renderGroupedTables(data.items_by_sentiment, textColumn);
    }

    function renderSummary(summary) {
      summaryEl.innerHTML = summary.map((item) => `
        <article class="summary-card ${escapeHtml(item.sentiment)}">
          <h3>${escapeHtml(item.sentiment)}</h3>
          <strong>${Number(item.percent).toFixed(2)}%</strong>
          <p class="muted">${item.count} rows</p>
        </article>
      `).join('');
    }

    function renderLegend(summary) {
      legendEl.innerHTML = summary.map((item) => `
        <span class="legend-item">
          <span class="swatch" style="background:${SENTIMENT_COLORS[item.sentiment]}"></span>
          ${escapeHtml(item.sentiment)} ${Number(item.percent).toFixed(2)}%
        </span>
      `).join('');
    }

    function renderChart(summary) {
      const context = chartCanvas.getContext('2d');
      const size = chartCanvas.width;
      const center = size / 2;
      const radius = size * 0.42;
      const innerRadius = size * 0.25;
      const total = summary.reduce((sum, item) => sum + item.count, 0);

      context.clearRect(0, 0, size, size);

      if (!total) {
        context.fillStyle = '#5f6368';
        context.font = '16px Arial';
        context.textAlign = 'center';
        context.fillText('No predictions', center, center);
        return;
      }

      let startAngle = -Math.PI / 2;

      for (const item of summary) {
        const slice = item.count / total;
        const endAngle = startAngle + slice * Math.PI * 2;

        context.beginPath();
        context.arc(center, center, radius, startAngle, endAngle);
        context.arc(center, center, innerRadius, endAngle, startAngle, true);
        context.closePath();
        context.fillStyle = SENTIMENT_COLORS[item.sentiment];
        context.fill();

        startAngle = endAngle;
      }

      context.fillStyle = '#202124';
      context.font = '700 28px Arial';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(`${total}`, center, center - 10);
      context.fillStyle = '#5f6368';
      context.font = '14px Arial';
      context.fillText('predicted rows', center, center + 18);
    }

    function renderGroupedTables(itemsBySentiment, textColumn) {
      groupedResultsEl.innerHTML = SENTIMENT_ORDER.map((sentiment) => {
        const rows = itemsBySentiment[sentiment] || [];
        const tableRows = rows.map((item) => `
          <tr>
            <td>${item.row_number}</td>
            <td class="text-cell">${escapeHtml(item[textColumn] || '')}</td>
            <td class="text-cell">${escapeHtml(item.clean_text || '')}</td>
            <td>${escapeHtml(item.predicted_sentiment)}</td>
          </tr>
        `).join('');

        return `
          <details open>
            <summary>${escapeHtml(sentiment)} (${rows.length} rows)</summary>
            ${rows.length ? `
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Row</th>
                      <th>Original Text</th>
                      <th>Clean Text</th>
                      <th>Sentiment</th>
                    </tr>
                  </thead>
                  <tbody>${tableRows}</tbody>
                </table>
              </div>
            ` : '<p class="empty">No rows for this sentiment.</p>'}
          </details>
        `;
      }).join('');
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>
</body>
</html>
